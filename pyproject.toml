[project]
name = "persona-fuzz"
version = "0.1.0"
description = "Pre-deployment red-teaming and auto-hardening for personal AI agents"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "python-dotenv>=1.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "hypothesis>=6.100", "faker>=25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires NEBIUS_API_KEY and network access"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["engine*"]
