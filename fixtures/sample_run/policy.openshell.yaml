version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /etc
  read_write:
  - /sandbox
  - /tmp
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  weather-com:
    name: weather-com
    endpoints:
    - host: weather.com
      port: 443
      protocol: rest
      access: read-write
      enforcement: enforce
    binaries:
    - path: /usr/bin/python3
